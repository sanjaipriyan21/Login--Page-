<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login Page</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <section class="welcome">
      <div class="blob three"></div>
      <div class="blob one"></div>
      <div class="blob two"></div>
      <div class="circle c1"></div>
      <div class="circle c2"></div>
      <div class="circle c3"></div>
      <h1>Welcome Page</h1>
      <p>Sign In To Your Account</p>
      <div class="site">WWW.YOURSITE.COM</div>
    </section>

    <section class="form-side">
      <div class="greeting">Hello !<strong>Good Morning</strong></div>
      <h2 class="form-title"><span>Login</span> Your Account</h2>

      <form action="#" method="post">
        <div class="field">
          <input type="email" name="email" placeholder="Email Address" autocomplete="email" required aria-label="Email address">
        </div>
        <div class="field">
          <input type="password" name="password" placeholder="Password" autocomplete="current-password" required aria-label="Password">
        </div>
        <div class="options">
          <label><input type="checkbox" name="remember"> Remember</label>
          <a href="#">Forgot Password ?</a>
        </div>
        <button type="submit" class="btn">SUBMIT</button>
        <a href="#" class="create">Create Account</a>
      </form>
    </section>
  </main>
</body>
</html>
